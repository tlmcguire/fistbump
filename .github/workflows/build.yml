name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux WebKitGTK dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libsecret-1-dev libxdo-dev libssl-dev
      - name: Check formatting
        working-directory: backend
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: Test Go
        working-directory: backend
        run: go test ./...
      - name: Test Go with the race detector
        if: matrix.os == 'ubuntu-22.04'
        working-directory: backend
        run: go test -race ./...
      - name: Install dependencies
        run: npm ci
      - name: Test renderer & scripts
        run: npm test
      - name: Test Rust host
        run: npm run test:rust
      - name: Build the Go backend
        run: npm run build:go

  release:
    name: Release (${{ matrix.os }} ${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            node_platform: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
            asset_label: Linux-x86_64
          - os: macos-latest
            node_platform: darwin
            arch: arm64
            target: aarch64-apple-darwin
            asset_label: macOS-arm64
          - os: macos-latest
            node_platform: darwin
            arch: x64
            target: x86_64-apple-darwin
            asset_label: macOS-x64
          - os: windows-latest
            node_platform: win32
            arch: x64
            target: x86_64-pc-windows-msvc
            asset_label: Windows-x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux WebKitGTK dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libsecret-1-dev libxdo-dev libssl-dev
      - name: Install dependencies
        run: npm ci
      - name: Build Go backend and fetch llama-server
        run: |
          node scripts/build-go.js --platform ${{ matrix.node_platform }} --arch ${{ matrix.arch }}
          node scripts/fetch-llama-server.js --platform ${{ matrix.node_platform }} --arch ${{ matrix.arch }}
          node scripts/stage-resources.js --platform ${{ matrix.node_platform }} --arch ${{ matrix.arch }}
      - name: Read release notes
        id: release_notes
        run: |
          {
            echo 'body<<EOF_RELEASE_NOTES'
            cat docs/release-notes.md
            echo ''
            echo 'EOF_RELEASE_NOTES'
          } >> "$GITHUB_OUTPUT"
      - name: Build and publish Tauri installers + signed updater artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          assetNamePattern: 'FistBump-[version]-${{ matrix.asset_label }}[ext]'
          updaterJsonPreferNsis: true
          args: --target ${{ matrix.target }}
