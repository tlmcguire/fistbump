name: Refresh Cost & Pay Reference Sources

on:
  schedule:
    # Runs on the 1st of every month (every ~30 days) at 06:00 UTC.
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-cost-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify and refresh cost-of-living, pay, tax, and benefits sources
        run: node scripts/update-cost-data.js

      - name: Commit updated source metadata if changed
        run: |
          if ! git diff --quiet backend/internal/cost/sources.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend/internal/cost/sources.json
            git commit -m "chore(cost): refresh 30-day reference source metadata"
            git push
          fi
