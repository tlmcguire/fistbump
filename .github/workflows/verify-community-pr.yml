name: Verify Community Data Security

on:
  pull_request_target:
    paths:
      - 'data/community-boards.json'
      - 'data/community-listings.json'
      - 'backend/internal/connectors/public_boards.json'

permissions:
  contents: read

jobs:
  audit-community-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Audit community boards, listings, and public ATS catalogs
        run: node trusted/scripts/verify-community-data.js --root pr
