name: End-to-end

on:
  # CI runs on every push and every pull request, and on a version tag (v0.2.0).
  push:
    branches: ['**']
    tags: ['v*', 'phase-*']
  pull_request:
  # Run it by hand from the Actions tab, or: gh workflow run <file> --ref <branch>
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  electron:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Build the Go backend
        run: npm run build:go
      - name: Run the Electron smoke tests
        run: xvfb-run --auto-servernum npm run test:e2e
      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
