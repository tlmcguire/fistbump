name: App

on:
  # CI runs at milestones, not on every push: a version tag (v0.2.0) or a phase tag (phase-07).
  push:
    tags: ['v*', 'phase-*']
  # Run it by hand from the Actions tab, or: gh workflow run <file> --ref <branch>
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test
