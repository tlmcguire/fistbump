<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fistbump</title>
  <link rel="stylesheet" href="styles/app.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Navigation">
      <div class="sidebar-top">
        <a class="brand" href="#/home" title="Home"><img src="img/logo.png" alt="fistbump"></a>
      </div>
      <nav id="nav" aria-label="Main"></nav>
      <div class="sidebar-bottom">
        <button id="status-pill" class="side-item" title="Suggestion engine"></button>
        <div id="theme-switch"></div>
        <button id="settings-btn" class="side-item" title="Settings (⌘,)"></button>
      </div>
    </aside>
    <main id="view" tabindex="-1"></main>
  </div>
  <div id="toasts" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
