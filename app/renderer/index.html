            <h1>Jobs</h1>

            <div class="tabs" role="tablist">
                <button type="button" id="tab-find" role="tab" aria-selected="true">Find jobs</button>
                <button type="button" id="tab-link" role="tab" aria-selected="false">Open a listing</button>
            </div>

            <!--new tabs-->

            <!--Find jobs tab panel-->
            <div id="panel-find">
                <form id="search-form">
                    <label for="search-keywords">Keywords</label>
                    <input id="search-keywords" type="text" placeholder="e.g. data analyst, web developer">

                    <label for="search-location">Location</label>
                    <input id="search-location" type="text" placeholder="e.g. Charleston, SC (optional)">

                    <label for="search-work-mode">Work mode</label>
                    <select id="search-work-mode">
                        <option>Any</option>
                        <option>Remote</option>
                        <option>Hybrid</option>
                        <option>On-site</option>

                    </select>

                    <label for="search-company">Company</label>
                    <input id="search-company" type="text" placeholder="e.g. Stripe (optional)">

                    <label for="search-industry">Industry</label>
                    <select id="search-industry">
                        <option value="">Any industry</option>
                    </select>

                    <details id="more-options">
                        <summary>More options</summary>

                        <div class="options">
                            <label for="search-level">Experience level</label>
                            <select id="search-level">
                                <option>Any</option>
                                <option>Intern</option>
                                <option>Entry</option>
                                <option>Mid</option>
                                <option>Senior</option>
                                <option>Lead</option>
                            </select>

                            <label for="search-posted">Posted within</label>
                            <select id="search-posted">
                                <option value="0">Any time</option>
                                <option value="1">Last day</option>
                                <option value="7">Last 7 days</option>
                                <option value="30">Last 30 days</option>
                                <option value="90">Last 90 days</option>
                            </select>

                            <label for="search-pay-min">Yearly pay (USD)</label>
                            <div class="pair">
                                <input id="search-pay-min" type="text" inputmode="numeric" placeholder="Minimum, e.g. 90k">
                                <input id="search-pay-max" type="text" inputmode="numeric" placeholder="Maximum (optional)">
                            </div>
                            <label class="check"><input id="search-require-pay" type="checkbox"> Hide postings that do not list pay</label>

                            <label for="search-exclude">Leave out titles with</label>
                            <input id="search-exclude" type="text" placeholder="e.g. sales, contract">
                        </div>
                    </details>

                    <div class="actions">
                        <button type="submit">Search</button>
                        <button type="button" id="clear-search">Clear</button>
                    </div>
                </form>
            </div>

            <!--Open a listing tab panel, old html moved inside tab container-->
            <div id="panel-load-listing" hidden>
                <form id="job-form">
                    <label for="job-url">Greenhouse job URL</label>
                    <input id="job-url" type="url" placeholder="Paste job posting URL" required>
                    <button type="submit">Load Listing</button>
                </form>
            </div>

            <!--Updated loading section states-->
            <section id="state-initial" class="state" >
                <p id="initial-message"></p>
            </section>

            <section id="state-loading" class="state" hidden>
                <p id="loading-message"></p>
                <button id="cancel-search" type="button" hidden>Cancel</button>
            </section>

            <!--load listing and search results section states-->
            <section id="state-results" class="state" hidden>
                <div class="results-head">
                    <p id="result-counts"></p>
                    <label class="sort">Sort by
                        <select id="result-sort">
                            <option value="relevance">Best match</option>
                            <option value="newest">Newest</option>
                        </select>
                    </label>
                </div>
                <p id="result-note" hidden></p>
                <p id="result-empty">Search yielded no results. Check search parameters and try again.</p>
                <ul id="result-list" class="results"></ul>
                <nav id="pager" class="pager" aria-label="Result pages" hidden></nav>
                <details id="result-errors" hidden>
                    <summary>Some boards could not be searched</summary>
                    <ul id="result-errors-list"></ul>
                </details>
            </section>

            <section id="state-success" class="state" hidden>
                <button id="back-to-results" type="button" hidden>&larr; Back to results</button>
                <div class="job-head">
                    <div id="job-logo" class="logo-tile" aria-hidden="true"></div>
                    <h2 id ="job-title" title="title"></h2>
                </div>
                <p id="job-company"></p>
                <p id="job-location"></p>
                <p id="job-updated"></p>
                <a id="job-link" href="#" target="_blank" hidden>Open original posting</a>
                <a id="company-link" href="#" target="_blank" hidden>Open company website</a>
                <h3 title="title">Description</h3>
                <p id="job-description"></p>
                <button id="reload-listing" type="button">Reload Listing</button>

            </section>

            <section id="state-error" class="state" hidden>
                <h2>An error has occurred</h2>
                <p id="error-message"></p>
                <button id="try-again" type="button">Try Again</button>
            </section>


        </main>

        <script src="js/api.js" defer></script>
        <script src="js/suggestions.js" defer></script>
        <script src="views/job-parser/job-parser.js" defer></script>
        <script src="js/app.js" defer></script>

    </body>
</html>
