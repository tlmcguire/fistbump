<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <title>Fistbump could not start</title>
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
        <style>
            /* The error screen follows the app's dark panes. Its styles live here, because this page
               stands on its own and does not use the app's stylesheets. */
            :root {
                --bg: #0b2457;
                --surface: #0f2c66;
                --raised: #153678;
                --line: rgba(255, 255, 255, 0.09);
                --text: #f2f5fb;
                --muted: rgba(242, 245, 251, 0.72);
                --accent: #cea615;
                --accent-hover: #e2b92a;
                --accent-ink: #0a255c;
                --danger-text: #ffb4ab;
                --radius: 6px;
            }

            *, *::before, *::after { box-sizing: border-box; }

            html, body {
                height: 100%;
                margin: 0;
            }

            body {
                font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
                background: var(--bg);
                color: var(--text);
                -webkit-font-smoothing: antialiased;
            }

            h1 { font-size: 18px; font-weight: 650; margin: 0 0 8px; }
            h2 { font-size: 13px; font-weight: 650; margin: 0 0 8px; color: var(--muted); }
            p { margin: 0; }

            main {
                display: flex;
                flex-direction: column;
                gap: 18px;
                height: 100%;
                padding: 28px 32px 24px;
            }

            .what { color: var(--text); }

            .log {
                flex: 1;
                min-height: 0;
                overflow: auto;
                margin: 0;
                padding: 12px 14px;
                background: rgba(0, 0, 0, 0.22);
                border: 1px solid var(--line);
                border-radius: var(--radius);
                color: var(--muted);
                font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                white-space: pre-wrap;
                word-break: break-word;
                user-select: text;
                -webkit-user-select: text;
            }

            .actions {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
            }

            button {
                height: 32px;
                padding: 0 14px;
                border: 1px solid var(--line);
                border-radius: var(--radius);
                background: var(--raised);
                color: var(--text);
                font: inherit;
                cursor: default;
            }

            button:hover { background: #1b4090; }

            button.primary {
                background: var(--accent);
                border-color: var(--accent);
                color: var(--accent-ink);
                font-weight: 650;
            }

            button.primary:hover { background: var(--accent-hover); }

            #status {
                min-height: 18px;
                color: var(--muted);
            }

            #status.error { color: var(--danger-text); }
        </style>
    </head>
    <body>
        <main>
            <div>
                <h1>Fistbump could not start</h1>
                <p class="what" id="message">The backend did not answer.</p>
            </div>

            <section>
                <h2>Last messages from the backend</h2>
                <pre class="log" id="stderr"></pre>
            </section>

            <div class="actions">
                <button type="button" id="copy" class="primary">Copy details</button>
                <button type="button" id="folder">Open data folder</button>
                <button type="button" id="quit">Quit</button>
            </div>

            <p id="status" role="status"></p>
        </main>

        <script src="js/tauri-bridge.js"></script>
        <script>
            // The page only talks to the main process: the backend may be dead.
            (() => {
                const api = window.api;
                const el = (id) => document.getElementById(id);
                const status = (text, isError) => {
                    const node = el('status');
                    node.textContent = text || '';
                    node.classList.toggle('error', Boolean(isError));
                };

                const load = async () => {
                    try {
                        const details = await api.error.details();
                        el('message').textContent = details?.message || 'The backend did not answer.';
                        const lines = Array.isArray(details?.stderr) ? details.stderr : [];
                        el('stderr').textContent = lines.length ? lines.join('\n') : '(the backend wrote nothing to its error log)';
                    } catch {
                        el('message').textContent = 'The backend did not answer.';
                        status('The details could not be read.', true);
                    }
                };

                el('copy').addEventListener('click', async () => {
                    const result = await api.error.copyDetails();
                    status(result?.error ? result.error.message : 'The details were copied to the clipboard.', Boolean(result?.error));
                });

                el('folder').addEventListener('click', async () => {
                    const result = await api.app.showDataFolder();
                    status(result?.error ? result.error.message : '', Boolean(result?.error));
                });

                el('quit').addEventListener('click', async () => {
                    await api.error.quit();
                });

                load();
            })();
        </script>
    </body>
</html>
