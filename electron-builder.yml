appId: com.fistbump.app
productName: FistBump
directories:
  buildResources: build
files:
  - app/**/*
  - "!app/tests/**"
asar: true
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: build/icon.icns
  category: public.app-category.productivity
  # The MVP builds are unsigned, so no signing identity is looked up and nothing is notarized.
  identity: null
  notarize: false
  artifactName: "${productName}-${version}-macOS-${arch}.${ext}"
  extraResources:
    - from: bin/darwin-${arch}/
      to: bin/
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: "${productName}-${version}-Windows-${arch}.${ext}"
  extraResources:
    - from: bin/win32-${arch}/
      to: bin/
linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: build/icon.png
  category: Office
  artifactName: "${productName}-${version}-Linux-${arch}.${ext}"
  extraResources:
    - from: bin/linux-${arch}/
      to: bin/
# The DMG window artwork: build/background.tiff is the background, with build/background@2x.tiff
# beside it for a Retina display, and build/badgeIcon.icns is the badge on the mounted volume.
dmg:
  background: build/background.tiff
  badgeIcon: build/badgeIcon.icns
# The installer sidebar, build/installerSidebar.bmp, shows on the welcome and finish pages, which
# only exist when the installer is the assisted kind rather than the one-click kind.
nsis:
  oneClick: false
