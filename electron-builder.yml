appId: com.fistbump.app
productName: FistBump
directories:
  buildResources: build
files:
  - app/**/*
  - "!app/tests/**"
asar: true
# Runs after each app is packed. On macOS it ad-hoc signs FistBump only; see scripts/adhoc-sign.js.
afterPack: scripts/adhoc-sign.js
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: build/icon.icns
  category: public.app-category.productivity
  # There is no Apple developer account, so nothing is notarized and no keychain certificate is used.
  # scripts/adhoc-sign.js ad-hoc signs the FistBump app after it is packed. Without a valid signature
  # macOS reports the app as damaged on Apple silicon once electron-builder adds the resources.
  # Gatekeeper still blocks the first launch, so the README says to open it with right-click.
  identity: null
  # Ad-hoc signing cannot use hardened runtime without an entitlement, and the app does not need it.
  hardenedRuntime: false
  notarize: false
  artifactName: "${productName}-${version}-macOS-${arch}.${ext}"
  extraResources:
    - from: bin/darwin-${arch}/
      to: bin/
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: "${productName}-${version}-Windows-${arch}.${ext}"
  extraResources:
    - from: bin/win32-${arch}/
      to: bin/
linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: build/icon.png
  category: Office
  artifactName: "${productName}-${version}-Linux-${arch}.${ext}"
  extraResources:
    - from: bin/linux-${arch}/
      to: bin/
# The DMG window artwork: build/background.tiff is the background, with build/background@2x.tiff
# beside it for a Retina display, and build/badgeIcon.icns is the badge on the mounted volume.
dmg:
  background: build/background.tiff
  badgeIcon: build/badgeIcon.icns
# The installer sidebar, build/installerSidebar.bmp, shows on the welcome and finish pages, which
# only exist when the installer is the assisted kind rather than the one-click kind.
nsis:
  oneClick: false
